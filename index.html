<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Dashboard · PPC Ads by Masud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body data-page="dashboard" data-title="Dashboard" data-eyebrow="Overview">

<div class="mp-sidebar-backdrop" id="mpBackdrop"></div>
<div class="mp-shell">
  <aside class="mp-sidebar" id="mpSidebar"></aside>
  <div class="mp-main">
    <header class="mp-topbar" id="mpTopbar"></header>

    <main class="mp-content">

      <!-- Summary cards -->
      <div class="row g-3" id="statCards"></div>

      <!-- Revenue chart + currency breakdown -->
      <div class="row g-3 mt-1">
        <div class="col-lg-8">
          <div class="mp-card h-100">
            <div class="mp-card-head">
              <div>
                <div class="mp-card-title">Revenue Overview</div>
                <div class="text-muted-mp small">Monthly revenue, last 12 months (BDT)</div>
              </div>
              <span class="mp-currency-pill">BDT</span>
            </div>
            <div class="mp-card-body">
              <canvas id="revenueChart" height="110"></canvas>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="mp-card h-100">
            <div class="mp-card-head">
              <div class="mp-card-title">Currency Breakdown</div>
            </div>
            <div class="mp-card-body" id="currencyBreakdown"></div>
          </div>
        </div>
      </div>

      <!-- Recent payments + recent clients -->
      <div class="row g-3 mt-1">
        <div class="col-lg-7">
          <div class="mp-card">
            <div class="mp-card-head">
              <div class="mp-card-title">Recent Payments</div>
              <a href="payments.html" class="small fw-semibold" style="color:var(--mp-blue)">View all</a>
            </div>
            <div class="mp-scroll-x">
              <table class="table mp-table mb-0">
                <thead><tr>
                  <th>Payment ID</th><th>Client</th><th>Date</th><th>Amount</th><th>BDT Value</th><th>Method</th><th>Service</th>
                </tr></thead>
                <tbody id="recentPaymentsBody"></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="mp-card">
            <div class="mp-card-head">
              <div class="mp-card-title">Recent Clients</div>
              <a href="clients.html" class="small fw-semibold" style="color:var(--mp-blue)">View all</a>
            </div>
            <div class="mp-scroll-x">
              <table class="table mp-table mb-0">
                <thead><tr><th>Client</th><th>Service</th><th>Status</th><th>Start</th></tr></thead>
                <tbody id="recentClientsBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<div class="mp-toast-stack" id="mpToastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="logo-data.js"></script>
<script src="currencies-data.js"></script>
<script src="db.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="drive-config.js"></script>
<script src="drive.js"></script>
<script src="auth.js"></script>
<script src="components.js"></script>
<script src="app.js"></script>
</body>
</html>
