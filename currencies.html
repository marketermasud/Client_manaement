<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currency Management · PPC Ads by Masud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="currencies" data-title="Currency Management" data-eyebrow="Settings">

<div class="mp-sidebar-backdrop" id="mpBackdrop"></div>
<div class="mp-shell">
  <aside class="mp-sidebar" id="mpSidebar"></aside>
  <div class="mp-main">
    <header class="mp-topbar" id="mpTopbar"></header>

    <main class="mp-content">
      <div class="alert border-0 d-flex gap-2 align-items-start mb-3" style="background:rgba(251,188,5,.12); border-radius:12px;">
        <i class="bi bi-info-circle-fill text-warning mt-1"></i>
        <div class="small">
          Rates below apply to <strong>new</strong> payments only. Existing payment records keep the exchange rate that was
          in effect when they were recorded, so historical revenue is never recalculated automatically.
        </div>
      </div>

      <div class="mp-card">
        <div class="mp-card-head flex-wrap gap-2">
          <div class="mp-card-title">Currencies <span class="text-muted-mp fw-normal" id="currencyCount"></span></div>
          <button class="btn btn-mp-primary" type="button" onclick="openCurrencyModal(null)"><i class="bi bi-plus-lg me-1"></i>Add Currency</button>
        </div>
        <div class="mp-card-body pb-2">
          <div class="mp-search-box" style="max-width:340px">
            <i class="bi bi-search"></i>
            <input type="text" class="form-control" id="currencySearch" placeholder="Search by code or currency name…">
          </div>
        </div>
        <div class="mp-scroll-x">
          <table class="table mp-table mb-0">
            <thead><tr><th>Code</th><th>Name</th><th>Symbol</th><th>BDT Exchange Rate</th><th>Last Updated</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="currenciesBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal fade" id="currencyModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content" style="border-radius:16px;">
    <div class="modal-header"><h5 class="modal-title" id="currencyModalTitle">Add Currency</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <form id="currencyForm">
    <div class="modal-body">
      <input type="hidden" id="cu_editCode">
      <div class="row g-3">
        <div class="col-6"><label class="form-label mp-required">Currency Code</label><input class="form-control text-uppercase" id="cu_code" maxlength="4" placeholder="USD" required></div>
        <div class="col-6"><label class="form-label mp-required">Symbol</label><input class="form-control" id="cu_symbol" placeholder="$" required></div>
        <div class="col-12"><label class="form-label mp-required">Currency Name</label><input class="form-control" id="cu_name" placeholder="US Dollar" required></div>
        <div class="col-6"><label class="form-label mp-required">BDT Exchange Rate</label><input type="number" min="0.01" step="0.0001" class="form-control" id="cu_rate" required></div>
        <div class="col-6"><label class="form-label mp-required">Status</label>
          <select class="form-select" id="cu_status"><option>Active</option><option>Disabled</option></select>
        </div>
      </div>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-mp-outline" data-bs-dismiss="modal">Cancel</button><button class="btn btn-mp-primary px-4">Save Currency</button></div>
    </form>
  </div></div>
</div>

<div class="mp-toast-stack" id="mpToastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/logo-data.js"></script>
<script src="js/currencies-data.js"></script>
<script src="js/db.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/currencies.js"></script>
</body>
</html>
