<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services · PPC Ads by Masud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="services" data-title="Services / Projects" data-eyebrow="Delivery">

<div class="mp-sidebar-backdrop" id="mpBackdrop"></div>
<div class="mp-shell">
  <aside class="mp-sidebar" id="mpSidebar"></aside>
  <div class="mp-main">
    <header class="mp-topbar" id="mpTopbar"></header>

    <main class="mp-content">
      <div class="mp-card">
        <div class="mp-card-head flex-wrap gap-2">
          <div class="mp-card-title">All Services / Projects</div>
          <button class="btn btn-mp-primary" id="addServiceBtn" type="button"><i class="bi bi-plus-lg me-1"></i>Add Service</button>
        </div>
        <div class="mp-card-body pb-2">
          <div class="row g-2">
            <div class="col-12 col-md-4">
              <div class="mp-search-box" style="max-width:100%"><i class="bi bi-search"></i>
                <input type="text" class="form-control" id="svcSearch" placeholder="Search description, client…"></div>
            </div>
            <div class="col-6 col-md-3">
              <select class="form-select" id="svcFilterClient"><option value="all">All Clients</option></select>
            </div>
            <div class="col-6 col-md-3">
              <select class="form-select" id="svcFilterType"><option value="all">All Types</option></select>
            </div>
            <div class="col-6 col-md-2">
              <select class="form-select" id="svcFilterStatus">
                <option value="all">All Status</option><option>Active</option><option>Completed</option><option>Paused</option><option>Cancelled</option>
              </select>
            </div>
          </div>
        </div>
        <div class="mp-scroll-x">
          <table class="table mp-table mb-0">
            <thead><tr><th>Service ID</th><th>Client</th><th>Type</th><th>Description</th><th>Start</th><th>End</th><th>Amount</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="servicesBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal fade" id="serviceModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content" style="border-radius:16px;">
    <div class="modal-header"><h5 class="modal-title" id="serviceModalTitle">Add Service</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <form id="serviceForm">
    <div class="modal-body">
      <input type="hidden" id="s_serviceId">
      <div class="mb-3"><label class="form-label mp-required">Client</label><select class="form-select" id="s_client" required></select></div>
          <div class="mb-3"><label class="form-label mp-required">Service Type</label>
            <select class="form-select" id="s_type" required></select>
          </div>
      <div class="mb-3"><label class="form-label">Description</label><input class="form-control" id="s_description"></div>
      <div class="row g-3 mb-3">
        <div class="col-6"><label class="form-label mp-required">Start Date</label><input type="date" class="form-control" id="s_startDate" required></div>
        <div class="col-6"><label class="form-label">End Date</label><input type="date" class="form-control" id="s_endDate"></div>
      </div>
      <div class="row g-3 mb-2">
        <div class="col-6"><label class="form-label mp-required">Deal Amount</label><input type="number" min="0" step="0.01" class="form-control" id="s_amount" required></div>
        <div class="col-6"><label class="form-label mp-required">Client's Currency</label><select class="form-select" id="s_currency" required></select></div>
      </div>
      <div class="small text-muted-mp mb-3" id="s_bdtPreview">≈ ৳0 — reference only, not counted in revenue. Actual revenue is tracked from the Payments page.</div>
      <div class="mb-1"><label class="form-label">Status <span class="text-muted-mp fw-normal">(editable any time)</span></label>
        <select class="form-select" id="s_status"><option>Active</option><option>Completed</option><option>Paused</option><option>Cancelled</option></select>
      </div>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-mp-outline" data-bs-dismiss="modal">Cancel</button><button class="btn btn-mp-primary px-4" id="s_saveBtn">Save Service</button></div>
    </form>
  </div></div>
</div>

<div class="mp-toast-stack" id="mpToastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/logo-data.js"></script>
<script src="js/currencies-data.js"></script>
<script src="js/db.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/services.js"></script>
</body>
</html>
