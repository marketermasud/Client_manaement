<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Reports · PPC Ads by Masud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<style>
  @media print {
    .mp-sidebar, .mp-topbar, .no-print { display: none !important; }
    .mp-main { margin-left: 0 !important; }
    body { background: #fff; }
    @page { size: A4; margin: 14mm; }
    .mp-statement { box-shadow: none !important; border: none !important; }
  }
  .mp-statement { max-width: 210mm; margin: 0 auto; background: #fff; }
  .mp-statement-logo { width: 46px; height: 46px; border-radius: 50%; }
</style>
</head>
<body data-page="reports" data-title="Reports" data-eyebrow="Insights">

<div class="mp-sidebar-backdrop no-print" id="mpBackdrop"></div>
<div class="mp-shell">
  <aside class="mp-sidebar no-print" id="mpSidebar"></aside>
  <div class="mp-main">
    <header class="mp-topbar no-print" id="mpTopbar"></header>

    <main class="mp-content">
      <div class="mp-card mb-3 no-print">
        <div class="mp-card-body">
          <div class="row g-2 align-items-end">
            <div class="col-12 col-md-4">
              <label class="form-label">Report</label>
              <select class="form-select" id="reportType">
                <option value="clientStatement">Client Statement (A4)</option>
                <option value="byMonth">Revenue by Month</option>
                <option value="byClient">Revenue by Client</option>
                <option value="byCurrency">Revenue by Currency</option>
                <option value="byService">Revenue by Service</option>
                <option value="paymentHistory">Payment History</option>
                <option value="outstanding">Outstanding Payments</option>
                <option value="activeClients">Active Clients</option>
                <option value="completedClients">Completed Clients</option>
              </select>
            </div>
            <div class="col-6 col-md-3 d-none" id="repClientWrap">
              <label class="form-label">Client</label>
              <select class="form-select" id="repClient"></select>
            </div>
            <div class="col-6 col-md-2" id="repFromWrap"><label class="form-label">From</label><input type="date" class="form-control" id="repFrom"></div>
            <div class="col-6 col-md-2" id="repToWrap"><label class="form-label">To</label><input type="date" class="form-control" id="repTo"></div>
            <div class="col-6 col-md-2 d-none" id="repExportWrap"><button class="btn btn-mp-outline w-100" id="repExport"><i class="bi bi-download me-1"></i>Export CSV</button></div>
            <div class="col-6 col-md-2"><button class="btn btn-mp-primary w-100" id="repPrint"><i class="bi bi-printer me-1"></i>Print / Save PDF</button></div>
          </div>
        </div>
      </div>

      <div id="reportOutput"></div>
    </main>
  </div>
</div>

<div class="mp-toast-stack no-print" id="mpToastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="logo-data.js"></script>
<script src="currencies-data.js"></script>
<script src="db.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="drive-config.js"></script>
<script src="drive.js"></script>
<script src="auth.js"></script>
<script src="components.js"></script>
<script src="reports.js"></script>
</body>
</html>
