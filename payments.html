<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Payments · PPC Ads by Masud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body data-page="payments" data-title="Payments" data-eyebrow="Revenue">

<div class="mp-sidebar-backdrop" id="mpBackdrop"></div>
<div class="mp-shell">
  <aside class="mp-sidebar" id="mpSidebar"></aside>
  <div class="mp-main">
    <header class="mp-topbar" id="mpTopbar"></header>

    <main class="mp-content">
      <div class="mp-card">
        <div class="mp-card-head flex-wrap gap-2">
          <div class="mp-card-title">All Payments</div>
          <button class="btn btn-mp-primary" id="addPaymentBtn" type="button"><i class="bi bi-plus-lg me-1"></i>Add Payment</button>
        </div>
        <div class="mp-card-body pb-2">
          <div class="row g-2">
            <div class="col-12 col-md-3">
              <div class="mp-search-box" style="max-width:100%"><i class="bi bi-search"></i>
                <input type="text" class="form-control" id="pSearch" placeholder="Search payment ID, reference…"></div>
            </div>
            <div class="col-6 col-md-2"><select class="form-select" id="pFilterClient"><option value="all">All Clients</option></select></div>
            <div class="col-6 col-md-2"><select class="form-select" id="pFilterCurrency"><option value="all">All Currencies</option></select></div>
            <div class="col-6 col-md-2"><select class="form-select" id="pFilterMethod"><option value="all">All Methods</option></select></div>
            <div class="col-6 col-md-1">
              <select class="form-select" id="pFilterStatus">
                <option value="all">Status</option>
                <option>Paid</option><option>Pending</option><option>Unpaid</option><option>Partial</option>
              </select>
            </div>
            <div class="col-6 col-md-1"><input type="date" class="form-control" id="pFrom" title="From date"></div>
            <div class="col-6 col-md-1"><input type="date" class="form-control" id="pTo" title="To date"></div>
          </div>
        </div>
        <div class="mp-scroll-x">
          <table class="table mp-table mb-0">
            <thead><tr>
              <th>Payment ID</th><th>Client</th><th>Date</th><th>Service</th><th>Amount</th><th>Rate</th>
              <th>BDT Value</th><th>Outstanding</th><th>Method</th><th>Status</th><th>Proof</th><th class="text-end">Actions</th>
            </tr></thead>
            <tbody id="paymentsBody"></tbody>
          </table>
        </div>
        <div class="d-flex justify-content-between align-items-center px-3 py-3 border-top" style="border-color:var(--mp-border) !important;">
          <div class="small text-muted-mp" id="paymentsCount"></div>
          <div class="fw-semibold" id="paymentsTotal"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal fade" id="paymentModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable"><div class="modal-content" style="border-radius:16px;">
    <div class="modal-header"><h5 class="modal-title" id="paymentModalTitle">Add Payment</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <form id="paymentForm">
    <div class="modal-body">
      <input type="hidden" id="p_paymentId">
      <input type="hidden" id="p_reservedId">
      <div class="mb-3"><label class="form-label mp-required">Client</label><select class="form-select" id="p_client" required></select></div>
      <div class="mb-3">
        <label class="form-label mp-required">Service</label>
        <select class="form-select" id="p_service" required></select>
        <div class="small text-muted-mp mt-1">Currency (from service): <span class="mp-currency-pill" id="p_currencyLabel">—</span> <span id="p_dueHint"></span></div>
        <div class="alert alert-danger py-2 px-3 small mt-2 mb-0 d-none" id="p_duplicateWarning"></div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-6"><label class="form-label mp-required">Payment Date</label><input type="date" class="form-control" id="p_date" required></div>
        <div class="col-6"><label class="form-label mp-required">Amount Received Now</label><input type="number" min="0.01" step="0.01" class="form-control" id="p_amount" required></div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-6"><label class="form-label mp-required">Exchange Rate (to BDT)</label><input type="number" min="0.01" step="0.0001" class="form-control" id="p_rate" required></div>
        <div class="col-6"><label class="form-label mp-required">Payment Method</label>
          <select class="form-select" id="p_method" required>
            <option>Bank Transfer</option><option>Wise</option><option>PayPal</option><option>Payoneer</option>
            <option>Stripe</option><option>bKash</option><option>Nagad</option><option>Rocket</option>
            <option>Upay</option><option>Cash</option><option>Card</option><option>Other</option>
          </select>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label mp-required">Status</label>
        <select class="form-select" id="p_status" required>
          <option>Pending</option><option>Paid</option><option>Unpaid</option><option>Partial</option>
        </select>
      </div>
      <div class="d-none" id="p_partialBlock">
        <div class="row g-3 mb-3">
          <div class="col-6"><label class="form-label mp-required">Total Deal Amount</label><input type="number" min="0" step="0.01" class="form-control" id="p_totalDue"></div>
          <div class="col-6"><label class="form-label">Remaining Balance</label><input type="text" class="form-control" id="p_remainingPreview" disabled></div>
        </div>
      </div>
      <div class="mb-3"><label class="form-label">Payment Reference</label><input class="form-control" id="p_reference"></div>
      <div class="mb-3"><label class="form-label">Notes</label><textarea class="form-control" id="p_notes" rows="2"></textarea></div>
      <div class="mb-1" id="p_proofContainer"></div>
      <div class="alert alert-light border small mt-2 mb-0" id="p_bdtPreview">BDT Value: —</div>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-mp-outline" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-mp-primary px-4" id="p_saveBtn">Save Payment</button></div>
    </form>
  </div></div>
</div>

<div class="mp-toast-stack" id="mpToastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="logo-data.js"></script>
<script src="currencies-data.js"></script>
<script src="db.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="drive-config.js"></script>
<script src="drive.js"></script>
<script src="auth.js"></script>
<script src="components.js"></script>
<script src="payments.js"></script>
</body>
</html>
