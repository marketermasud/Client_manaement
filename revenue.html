<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Revenue · PPC Ads by Masud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body data-page="revenue" data-title="Revenue Analytics" data-eyebrow="Revenue">

<div class="mp-sidebar-backdrop" id="mpBackdrop"></div>
<div class="mp-shell">
  <aside class="mp-sidebar" id="mpSidebar"></aside>
  <div class="mp-main">
    <header class="mp-topbar" id="mpTopbar"></header>

    <main class="mp-content">
      <div class="row g-3" id="revenueStats"></div>

      <div class="mp-card mt-3">
        <div class="mp-card-body">
          <div class="row g-2">
            <div class="col-6 col-md-2"><input type="date" class="form-control" id="rFrom" title="From"></div>
            <div class="col-6 col-md-2"><input type="date" class="form-control" id="rTo" title="To"></div>
            <div class="col-6 col-md-2"><select class="form-select" id="rCurrency"><option value="all">All Currencies</option></select></div>
            <div class="col-6 col-md-3"><select class="form-select" id="rClient"><option value="all">All Clients</option></select></div>
            <div class="col-6 col-md-2"><select class="form-select" id="rMethod"><option value="all">All Methods</option></select></div>
            <div class="col-6 col-md-1"><button class="btn btn-mp-outline w-100" id="rClear">Clear</button></div>
          </div>
        </div>
      </div>

      <div class="row g-3 mt-1">
        <div class="col-lg-6">
          <div class="mp-card"><div class="mp-card-head"><div class="mp-card-title">Monthly Revenue</div></div>
            <div class="mp-card-body"><canvas id="chartMonthly" height="180"></canvas></div></div>
        </div>
        <div class="col-lg-6">
          <div class="mp-card"><div class="mp-card-head"><div class="mp-card-title">Revenue by Currency</div></div>
            <div class="mp-card-body"><canvas id="chartCurrency" height="180"></canvas></div></div>
        </div>
        <div class="col-lg-6">
          <div class="mp-card"><div class="mp-card-head"><div class="mp-card-title">Revenue by Client</div></div>
            <div class="mp-card-body"><canvas id="chartClient" height="200"></canvas></div></div>
        </div>
        <div class="col-lg-6">
          <div class="mp-card"><div class="mp-card-head"><div class="mp-card-title">Revenue by Service</div></div>
            <div class="mp-card-body"><canvas id="chartService" height="200"></canvas></div></div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="mp-toast-stack" id="mpToastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="logo-data.js"></script>
<script src="currencies-data.js"></script>
<script src="db.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="drive-config.js"></script>
<script src="drive.js"></script>
<script src="auth.js"></script>
<script src="components.js"></script>
<script src="revenue.js"></script>
</body>
</html>
