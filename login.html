<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In · PPC Ads by Masud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="mp-auth-wrap">
  <div class="mp-auth-card">
    <div class="text-center mb-4">
      <img id="loginLogo" src="" alt="PPC Ads by Masud" style="width:64px;height:64px;border-radius:50%;box-shadow:0 0 0 3px #fff, 0 0 0 4px #eef1f9;">
      <h1 class="h5 fw-bold mt-3 mb-0">PPC Ads by Masud</h1>
      <div class="text-muted-mp small">Client &amp; Revenue Dashboard</div>
      <div class="mp-brand-bar mt-3" style="max-width:120px;margin:0 auto;"></div>
    </div>

    <div id="loginAlert" class="alert alert-danger py-2 small d-none" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label mp-required" for="loginEmail">Email</label>
        <input type="email" class="form-control" id="loginEmail" placeholder="you@agency.com" required>
        <div class="invalid-feedback">Enter a valid email address.</div>
      </div>
      <div class="mb-2">
        <label class="form-label mp-required" for="loginPassword">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required minlength="4">
          <button class="btn btn-mp-outline" type="button" id="togglePw" aria-label="Show password"><i class="bi bi-eye"></i></button>
        </div>
        <div class="invalid-feedback">Password must be at least 4 characters.</div>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-4 mt-2">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe" checked>
          <label class="form-check-label small" for="rememberMe">Remember me</label>
        </div>
        <a href="#" class="small fw-semibold" id="forgotLink" style="color:var(--mp-blue)">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-mp-primary w-100 py-2" id="loginBtn">
        <span class="btn-text">Sign In</span>
        <span class="spinner-border spinner-border-sm ms-2 d-none" id="loginSpinner"></span>
      </button>
    </form>

    <div class="text-center small text-muted-mp mt-4" id="loginModeCaption">
      Loading…
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/logo-data.js"></script>
<script src="js/currencies-data.js"></script>
<script src="js/db.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById("loginLogo").src = MP_LOGO_BASE64;

  document.getElementById("loginModeCaption").textContent = MPAuth.isFirebaseActive()
    ? "Sign in with your Firebase account email and password."
    : "Demo mode — enter any email and a password of 4+ characters.";

  // If already signed in, skip straight to the dashboard.
  MPAuth.ready(function () { window.location.href = "index.html"; });

  const form = document.getElementById("loginForm");
  const alertBox = document.getElementById("loginAlert");
  const btn = document.getElementById("loginBtn");
  const spinner = document.getElementById("loginSpinner");

  document.getElementById("togglePw").addEventListener("click", function () {
    const input = document.getElementById("loginPassword");
    const icon = this.querySelector("i");
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    icon.className = show ? "bi bi-eye-slash" : "bi bi-eye";
  });

  document.getElementById("forgotLink").addEventListener("click", function (e) {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value;
    MPAuth.resetPassword(email).then(() => {
      alertBox.className = "alert alert-success py-2 small";
      alertBox.textContent = "Password reset email sent to " + email + ".";
      alertBox.classList.remove("d-none");
    }).catch(err => {
      alertBox.className = "alert alert-danger py-2 small";
      alertBox.textContent = err.message;
      alertBox.classList.remove("d-none");
    });
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!form.checkValidity()) { form.classList.add("was-validated"); return; }
    alertBox.classList.add("d-none");
    btn.disabled = true;
    spinner.classList.remove("d-none");
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;
    const remember = document.getElementById("rememberMe").checked;

    MPAuth.login(email, password, remember).then(() => {
      window.location.href = "index.html";
    }).catch(err => {
      alertBox.className = "alert alert-danger py-2 small";
      alertBox.textContent = mpFriendlyAuthError(err);
      alertBox.classList.remove("d-none");
    }).finally(() => {
      btn.disabled = false;
      spinner.classList.add("d-none");
    });
  });

  function mpFriendlyAuthError(err) {
    const code = err && err.code;
    if (code === "auth/user-not-found" || code === "auth/wrong-password" || code === "auth/invalid-credential") return "Incorrect email or password.";
    if (code === "auth/too-many-requests") return "Too many attempts. Please wait a moment and try again.";
    if (code === "auth/invalid-email") return "Enter a valid email address.";
    return (err && err.message) || "Something went wrong. Please try again.";
  }
</script>
</body>
</html>
